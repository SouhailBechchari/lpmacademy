<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16395B" />
    <meta name="description" content="Passeport Formation — la formation continue pensée pour les pharmaciens d'aujourd'hui." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pf-theme')
          t = t === 'light' || t === 'dark' ? t : 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/images/icone.png" />
    <link rel="apple-touch-icon" href="/images/icone.png" />
    <title>Passeport Formation | Pharmaciens</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
